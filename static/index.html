<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IMAC Handbook Search</title>
    <link rel="stylesheet" href="/styles.css?v=next-score-4" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>IMAC Handbook Search</h1>
        <p id="stats">Loading index...</p>
      </div>
      <span class="status" id="status">offline</span>
    </header>

    <main>
      <section class="search-panel">
        <form id="search-form">
          <label for="query">Search</label>
          <div class="search-row">
            <input id="query" name="query" autocomplete="off" value="MMR contraindications during pregnancy" />
            <button type="submit">Search</button>
          </div>
          <div class="controls">
            <input id="top-k" type="hidden" value="5" />
            <span class="mode-note">Showing one handbook page at a time from the top likely matches</span>
            <label class="check">
              <input id="rerank" type="checkbox" checked />
              Rerank
            </label>
          </div>
        </form>
      </section>

      <section class="summary" id="summary" hidden></section>
      <section class="results" id="results"></section>
      <section class="chapter-viewer" id="chapter-viewer" hidden>
        <div class="chapter-viewer-head">
          <div>
            <h2 id="chapter-viewer-title">Highlighted Handbook Page</h2>
            <p id="chapter-viewer-section"></p>
          </div>
          <div class="chapter-viewer-actions">
            <span id="chapter-viewer-score"></span>
            <button id="chapter-viewer-next" class="next-result" type="button">Next likely</button>
            <a id="chapter-viewer-open" href="#" target="_blank" rel="noreferrer">Open highlighted page</a>
          </div>
        </div>
        <iframe id="chapter-frame" title="Highlighted handbook chapter"></iframe>
      </section>
    </main>

    <script src="/app.js?v=next-score-4"></script>
  </body>
</html>
