<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IMAC Handbook Search</title>
    <link rel="stylesheet" href="/styles.css?v=reference-glass-1" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">IMAC</div>
          <div>
            <h1>IMAC Handbook Search</h1>
            <p id="stats">Loading index...</p>
          </div>
        </div>
        <span class="status" id="status">offline</span>
      </div>
    </header>

    <main>
      <section class="search-panel">
        <form id="search-form">
          <label for="query">Search</label>
          <div class="search-row">
            <input id="query" name="query" autocomplete="off" value="MMR contraindications during pregnancy" />
            <button type="submit">Search</button>
          </div>
          <div class="controls">
            <input id="top-k" type="hidden" value="5" />
            <span class="mode-note">Showing one handbook page at a time from the top ranked matches</span>
            <label class="check">
              <input id="rerank" type="checkbox" checked />
              Rerank
            </label>
          </div>
        </form>
      </section>

      <section class="summary" id="summary" hidden></section>
      <section class="results" id="results"></section>
      <section class="chapter-viewer" id="chapter-viewer" hidden>
        <div class="chapter-viewer-head">
          <button class="viewer-back" type="button" data-action="back-to-search" aria-label="Back to search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
          <div>
            <h2 id="chapter-viewer-title">Highlighted Handbook Page</h2>
            <p id="chapter-viewer-section"></p>
          </div>
          <div class="chapter-viewer-actions">
            <span id="chapter-viewer-score"></span>
            <div id="chapter-viewer-nav" class="rank-nav" aria-label="Ranked matches"></div>
            <div id="chapter-viewer-feedback" class="feedback-controls" aria-label="Result feedback"></div>
            <a id="chapter-viewer-open" href="#" target="_blank" rel="noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"></path>
              </svg>
              <span>Open highlighted page</span>
            </a>
          </div>
        </div>
        <iframe id="chapter-frame" title="Highlighted handbook chapter"></iframe>
      </section>
    </main>

    <script src="/app.js?v=reference-glass-1"></script>
  </body>
</html>
